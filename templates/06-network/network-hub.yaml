AWSTemplateFormatVersion: '2010-09-09'
Description: SAP_Retail Network shared-services Transit Gateway. Deploy only in the separately adopted Network account.
Parameters:
  OrgArn: { Type: String, AllowedPattern: '^arn:aws:organizations::\d{12}:organization/o-[a-z0-9]+$' }
  AmazonSideAsn: { Type: Number, Default: 64512 }
Resources:
  TransitGateway:
    Type: AWS::EC2::TransitGateway
    Properties:
      Description: SAP_Retail shared services Transit Gateway
      AmazonSideAsn: !Ref AmazonSideAsn
      AutoAcceptSharedAttachments: enable
      DefaultRouteTableAssociation: disable
      DefaultRouteTablePropagation: disable
      DnsSupport: enable
      Tags: [{ Key: Name, Value: sr-lz-tgw }, { Key: Client, Value: SAP_Retail }]
  TransitGatewayShare:
    Type: AWS::RAM::ResourceShare
    Properties:
      Name: sr-lz-tgw-share
      AllowExternalPrincipals: false
      Principals: [!Ref OrgArn]
      ResourceArns: [!Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:transit-gateway/${TransitGateway}']
Outputs:
  TransitGatewayId: { Value: !Ref TransitGateway }
