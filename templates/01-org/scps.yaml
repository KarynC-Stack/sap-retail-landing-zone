AWSTemplateFormatVersion: '2010-09-09'
Description: SAP_Retail opt-in SCPs. Attach only after approved policy simulation and Control Tower baseline success.
Parameters:
  RootId: { Type: String, AllowedPattern: '^r-[0-9a-z]{4,32}$' }
  SecurityOuId: { Type: String, AllowedPattern: '^ou-[a-z0-9-]+$' }
  KenyaOuId: { Type: String, AllowedPattern: '^ou-[a-z0-9-]+$' }
  KenyaNonProductionOuId: { Type: String, AllowedPattern: '^ou-[a-z0-9-]+$' }
  UgandaOuId: { Type: String, AllowedPattern: '^ou-[a-z0-9-]+$' }
  UgandaNonProductionOuId: { Type: String, AllowedPattern: '^ou-[a-z0-9-]+$' }
  SandboxOuId: { Type: String, AllowedPattern: '^ou-[a-z0-9-]+$' }
  ApnTagValue: { Type: String, Default: '<APN_ID>' }
  # The questionnaire answers for Q2, Q4 and Q7 describe the APN tag as enforced by SCP. The policy
  # below implements that. Attachment is gated because an enforcing tag SCP denies resource creation
  # that omits the tag, which affects every principal in the organization: it must be simulated and
  # approved first. Design decision 21 records the current report-only position and this gate.
  AttachTagEnforcementScp: { Type: String, Default: 'false', AllowedValues: ['true', 'false'] }
  # Breaks the archive delete-deny open for the deployment roles. Normal state is 'false', which
  # denies deletion to every principal including the pipeline: that unexempted deny is what makes
  # the retention claim meaningful. Set to 'true' only to clear an empty orphaned archive bucket
  # left by a failed deploy, and set it straight back. Never set it while the archive holds logs.
  AllowArchiveCleanup: { Type: String, Default: 'false', AllowedValues: ['true', 'false'] }
Conditions:
  WithTagEnforcement: !Equals [!Ref AttachTagEnforcementScp, 'true']
  WithArchiveCleanup: !Equals [!Ref AllowArchiveCleanup, 'true']
Resources:
  RootProtection:
    Type: AWS::Organizations::Policy
    Properties:
      Name: root-protection
      Type: SERVICE_CONTROL_POLICY
      TargetIds: [!Ref RootId]
      Content:
        Version: '2012-10-17'
        Statement:
          - { Sid: DenyLeaveOrganization, Effect: Deny, Action: organizations:LeaveOrganization, Resource: '*' }
          # Q2/Q4: "root activity blocked by SCP". SCPs never restrict the management account, so this
          # denies the root user of every member account. Day-to-day access is Identity Center and
          # break-glass is an IAM role, so nothing legitimate uses a member root user.
          - Sid: DenyMemberAccountRootUser
            Effect: Deny
            Action: '*'
            Resource: '*'
            Condition: { StringLike: { aws:PrincipalArn: 'arn:aws:iam::*:root' } }
          - Sid: ProtectLandingZoneRoles
            Effect: Deny
            Action: [iam:DeleteRole, iam:UpdateAssumeRolePolicy, iam:DetachRolePolicy]
            Resource: ['arn:aws:iam::*:role/AWSControlTowerExecution', 'arn:aws:iam::*:role/stacksets-exec-*', 'arn:aws:iam::*:role/sr-lz-*', 'arn:aws:iam::*:role/KitstekSecurityAuditRole']
            Condition: { ArnNotLike: { aws:PrincipalArn: ['arn:aws:iam::*:role/AWSControlTowerExecution', 'arn:aws:iam::*:role/stacksets-exec-*', 'arn:aws:iam::*:role/sr-lz-cfn-exec'] } }
  SecurityServicesProtection:
    Type: AWS::Organizations::Policy
    Properties:
      Name: security-services-protection
      Type: SERVICE_CONTROL_POLICY
      TargetIds: [!Ref RootId]
      Content:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyDisableSecurityServices
            Effect: Deny
            Action: [guardduty:DeleteDetector, guardduty:UpdateOrganizationConfiguration, securityhub:DisableSecurityHub, config:DeleteConfigurationRecorder, config:DeleteDeliveryChannel, cloudtrail:DeleteTrail, cloudtrail:StopLogging, access-analyzer:DeleteAnalyzer]
            Resource: '*'
            Condition: { ArnNotLike: { aws:PrincipalArn: ['arn:aws:iam::*:role/AWSControlTowerExecution', 'arn:aws:iam::*:role/stacksets-exec-*', 'arn:aws:iam::*:role/sr-lz-cfn-exec'] } }
  SecurityLogProtection:
    Type: AWS::Organizations::Policy
    Properties:
      Name: log-archive-protection
      Type: SERVICE_CONTROL_POLICY
      TargetIds: [!Ref SecurityOuId]
      Content:
        Version: '2012-10-17'
        Statement:
          # Deletion and governance bypass are denied to EVERY principal, with no exemption for the
          # deployment roles. Nothing in the pipeline has a reason to delete the archive, and an
          # unexempted deny is what makes the retention claim meaningful.
          - Sid: DenyLogBucketDeletion
            Effect: Deny
            Action: [s3:DeleteBucket, s3:DeleteObject, s3:DeleteObjectVersion, s3:BypassGovernanceRetention]
            Resource: ['arn:aws:s3:::sr-lz-log-archive-*', 'arn:aws:s3:::sr-lz-log-archive-*/*']
            Condition: !If
              - WithArchiveCleanup
              - ArnNotLike: { aws:PrincipalArn: ['arn:aws:iam::*:role/AWSControlTowerExecution', 'arn:aws:iam::*:role/stacksets-exec-*', 'arn:aws:iam::*:role/sr-lz-cfn-exec', 'arn:aws:iam::*:role/OrganizationAccountAccessRole'] }
              - !Ref 'AWS::NoValue'
          # Object Lock is set once, at bucket creation, by the StackSet execution role. Everyone
          # else is denied, so the mode and retention period cannot be weakened afterwards. Without
          # this exemption the deployment is blocked by this very policy: creating a bucket with a
          # default retention calls PutObjectLockConfiguration.
          - Sid: DenyObjectLockWeakening
            Effect: Deny
            Action: s3:PutBucketObjectLockConfiguration
            Resource: ['arn:aws:s3:::sr-lz-log-archive-*', 'arn:aws:s3:::sr-lz-log-archive-*/*']
            Condition: { ArnNotLike: { aws:PrincipalArn: ['arn:aws:iam::*:role/AWSControlTowerExecution', 'arn:aws:iam::*:role/stacksets-exec-*', 'arn:aws:iam::*:role/sr-lz-cfn-exec'] } }
  KenyaRegion:
    Type: AWS::Organizations::Policy
    Properties:
      Name: region-kenya
      Type: SERVICE_CONTROL_POLICY
      TargetIds: [!Ref KenyaOuId]
      Content:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyOutsideIreland
            Effect: Deny
            NotAction: [iam:*, organizations:*, cloudfront:*, route53:*, sso:*, sts:*, support:*, health:*, pricing:*, aws-portal:*, budgets:*, ce:*, 's3:ListAllMyBuckets', 's3:GetAccountPublicAccessBlock', 's3:PutAccountPublicAccessBlock', 'ec2:DescribeRegions']
            Resource: '*'
            Condition: { StringNotEquals: { aws:RequestedRegion: eu-west-1 }, ArnLike: { aws:PrincipalArn: 'arn:aws:iam::*:role/*' } }
  UgandaRegion:
    Type: AWS::Organizations::Policy
    Properties:
      Name: region-uganda-deferred
      Type: SERVICE_CONTROL_POLICY
      TargetIds: [!Ref UgandaOuId]
      Content:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyOutsideApprovedOperatingRegion
            Effect: Deny
            NotAction: [iam:*, organizations:*, cloudfront:*, route53:*, sso:*, sts:*, support:*, health:*, pricing:*, aws-portal:*, budgets:*, ce:*, 's3:ListAllMyBuckets', 's3:GetAccountPublicAccessBlock', 's3:PutAccountPublicAccessBlock', 'ec2:DescribeRegions']
            Resource: '*'
            Condition: { StringNotEquals: { aws:RequestedRegion: eu-west-1 }, ArnLike: { aws:PrincipalArn: 'arn:aws:iam::*:role/*' } }
  NonProductionLimits:
    Type: AWS::Organizations::Policy
    Properties:
      Name: nonproduction-instance-limits
      Type: SERVICE_CONTROL_POLICY
      TargetIds: [!Ref KenyaNonProductionOuId, !Ref UgandaNonProductionOuId, !Ref SandboxOuId]
      Content:
        Version: '2012-10-17'
        Statement:
          - { Sid: DenyProductionClassInstances, Effect: Deny, Action: ec2:RunInstances, Resource: 'arn:aws:ec2:*:*:instance/*', Condition: { StringLike: { ec2:InstanceType: ['*.8xlarge', '*.12xlarge', '*.16xlarge', '*.24xlarge', '*.metal*', 'p*', 'g*', 'trn*'] } } }
  # Q2/Q4/Q7: the APN attribution tag requirement on created resources. Preventive layer; the
  # corrective layer is templates/04-security/member/apn-tag-enforcer.yaml, which tags resources
  # that do not support tag-on-create. Attached only when AttachTagEnforcementScp is 'true'.
  ApnTagRequirement:
    Type: AWS::Organizations::Policy
    Condition: WithTagEnforcement
    Properties:
      Name: require-apn-tag
      Type: SERVICE_CONTROL_POLICY
      TargetIds: [!Ref RootId]
      Content:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyCreateWithoutApnTag
            Effect: Deny
            Action: [ec2:RunInstances, ec2:CreateVolume, rds:CreateDBInstance, rds:CreateDBCluster, s3:CreateBucket, lambda:CreateFunction, elasticloadbalancing:CreateLoadBalancer, eks:CreateCluster, ecs:CreateCluster]
            Resource: '*'
            Condition:
              'Null': { 'aws:RequestTag/aws-apn-id': 'true' }
              ArnNotLike: { aws:PrincipalArn: ['arn:aws:iam::*:role/AWSControlTowerExecution', 'arn:aws:iam::*:role/stacksets-exec-*', 'arn:aws:iam::*:role/sr-lz-cfn-exec', 'arn:aws:iam::*:role/aws-service-role/*'] }
          - Sid: DenyWrongApnTagValue
            Effect: Deny
            Action: [ec2:RunInstances, ec2:CreateVolume, rds:CreateDBInstance, rds:CreateDBCluster, s3:CreateBucket, lambda:CreateFunction, elasticloadbalancing:CreateLoadBalancer, eks:CreateCluster, ecs:CreateCluster]
            Resource: '*'
            Condition:
              StringNotEquals: { 'aws:RequestTag/aws-apn-id': !Ref ApnTagValue }
              'Null': { 'aws:RequestTag/aws-apn-id': 'false' }
              ArnNotLike: { aws:PrincipalArn: ['arn:aws:iam::*:role/AWSControlTowerExecution', 'arn:aws:iam::*:role/stacksets-exec-*', 'arn:aws:iam::*:role/sr-lz-cfn-exec', 'arn:aws:iam::*:role/aws-service-role/*'] }
          - Sid: DenyRemovingApnTag
            Effect: Deny
            Action: [ec2:DeleteTags, s3:PutBucketTagging, rds:RemoveTagsFromResource, lambda:UntagResource]
            Resource: '*'
            Condition:
              'ForAnyValue:StringEquals': { 'aws:TagKeys': 'aws-apn-id' }
              ArnNotLike: { aws:PrincipalArn: ['arn:aws:iam::*:role/AWSControlTowerExecution', 'arn:aws:iam::*:role/stacksets-exec-*', 'arn:aws:iam::*:role/sr-lz-cfn-exec', 'arn:aws:iam::*:role/aws-service-role/*'] }
  SandboxIsolation:
    Type: AWS::Organizations::Policy
    Properties:
      Name: sandbox-isolation
      Type: SERVICE_CONTROL_POLICY
      TargetIds: [!Ref SandboxOuId]
      Content:
        Version: '2012-10-17'
        Statement:
          - { Sid: DenyCorporateConnectivity, Effect: Deny, Action: [ec2:CreateTransitGatewayVpcAttachment, ec2:CreateVpcPeeringConnection, ec2:CreateVpnConnection, ram:AcceptResourceShareInvitation], Resource: '*' }
