AWSTemplateFormatVersion: '2010-09-09'
Description: SAP_Retail Log Archive Object Lock bucket. Preflight the pinned Control Tower custom-bucket manifest contract before use.
Parameters:
  OrgId: { Type: String, AllowedPattern: '^o-[a-z0-9]{10,32}$' }
  TotalRetentionDays: { Type: Number, Default: 1460, MinValue: 1 }
  ObjectLockMode: { Type: String, Default: GOVERNANCE, AllowedValues: [GOVERNANCE, COMPLIANCE] }
  SourceLoggingBucketName:
    Type: String
    Default: ''
    Description: Control Tower managed log bucket that replicates into this write-once archive. Empty disables the replication role.
Conditions:
  CreateReplicationRole: !Not [!Equals [!Ref SourceLoggingBucketName, '']]
Resources:
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'sr-lz-log-archive-access-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      VersioningConfiguration: { Status: Enabled }
  LogArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'sr-lz-log-archive-${AWS::AccountId}-${AWS::Region}'
      ObjectLockEnabled: true
      ObjectLockConfiguration: { ObjectLockEnabled: Enabled, Rule: { DefaultRetention: { Mode: !Ref ObjectLockMode, Days: !Ref TotalRetentionDays } } }
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }, BucketKeyEnabled: true }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      LoggingConfiguration: { DestinationBucketName: !Ref AccessLogsBucket, LogFilePrefix: access/ }
      LifecycleConfiguration: { Rules: [{ Id: standard-then-glacier, Status: Enabled, Transitions: [{ StorageClass: GLACIER, TransitionInDays: 365 }], ExpirationInDays: !Ref TotalRetentionDays }] }
  LogArchiveBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogArchiveBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Sid: DenyInsecureTransport, Effect: Deny, Principal: '*', Action: 's3:*', Resource: [!GetAtt LogArchiveBucket.Arn, !Sub '${LogArchiveBucket.Arn}/*'], Condition: { Bool: { aws:SecureTransport: 'false' } } }
          - { Sid: CloudTrailAclCheck, Effect: Allow, Principal: { Service: cloudtrail.amazonaws.com }, Action: s3:GetBucketAcl, Resource: !GetAtt LogArchiveBucket.Arn }
          - { Sid: CloudTrailDelivery, Effect: Allow, Principal: { Service: cloudtrail.amazonaws.com }, Action: s3:PutObject, Resource: !Sub '${LogArchiveBucket.Arn}/AWSLogs/*', Condition: { StringEquals: { aws:SourceOrgID: !Ref OrgId, 's3:x-amz-acl': bucket-owner-full-control } } }
          - { Sid: ConfigDelivery, Effect: Allow, Principal: { Service: config.amazonaws.com }, Action: s3:PutObject, Resource: !Sub '${LogArchiveBucket.Arn}/AWSLogs/*', Condition: { StringEquals: { aws:SourceOrgID: !Ref OrgId, 's3:x-amz-acl': bucket-owner-full-control } } }
          - { Sid: VpcAndResolverDelivery, Effect: Allow, Principal: { Service: delivery.logs.amazonaws.com }, Action: s3:PutObject, Resource: !Sub '${LogArchiveBucket.Arn}/AWSLogs/*', Condition: { StringEquals: { aws:SourceOrgID: !Ref OrgId, 's3:x-amz-acl': bucket-owner-full-control } } }
  ReplicationRole:
    Type: AWS::IAM::Role
    Condition: CreateReplicationRole
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: S3 assumes this role to replicate Control Tower log objects into the write-once Object Lock archive.
        must:
          - GetObjectRetention and GetObjectLegalHold are required because the destination has Object Lock enabled.
          - Scope stays limited to the named Control Tower source bucket and this archive bucket.
    Properties:
      RoleName: !Sub 'sr-lz-log-archive-replication-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref 'AWS::AccountId' }
      Policies:
        - PolicyName: replicate-controltower-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetReplicationConfiguration, s3:ListBucket]
                Resource: !Sub 'arn:aws:s3:::${SourceLoggingBucketName}'
              - Effect: Allow
                Action: [s3:GetObjectVersionForReplication, s3:GetObjectVersionAcl, s3:GetObjectVersionTagging, s3:GetObjectRetention, s3:GetObjectLegalHold]
                Resource: !Sub 'arn:aws:s3:::${SourceLoggingBucketName}/*'
              - Effect: Allow
                Action: [s3:ReplicateObject, s3:ReplicateDelete, s3:ReplicateTags]
                Resource: !Sub '${LogArchiveBucket.Arn}/*'
      Tags: [{ Key: Client, Value: SAP_Retail }, { Key: ManagedBy, Value: Kitstek }]
  # The replication configuration has to live on the Control Tower managed source bucket, which
  # CloudFormation does not own. This custom resource applies it so the configuration stays in
  # code and is re-applied on every stack update. Delete is a deliberate no-op: removing this
  # stack must not silently stop the write-once archive from receiving logs.
  # No explicit role name and no Retain here, so a failed deploy leaves no orphan behind.
  ReplicationConfigFunctionRole:
    Type: AWS::IAM::Role
    Condition: CreateReplicationRole
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: 'sts:AssumeRole' }
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole']
      Policies:
        - PolicyName: apply-source-bucket-replication
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:PutReplicationConfiguration', 's3:GetReplicationConfiguration']
                Resource: !Sub 'arn:aws:s3:::${SourceLoggingBucketName}'
              - Effect: Allow
                Action: 'iam:PassRole'
                Resource: !GetAtt ReplicationRole.Arn
      Tags: [{ Key: Client, Value: SAP_Retail }, { Key: ManagedBy, Value: Kitstek }]
  ReplicationConfigFunction:
    Type: AWS::Lambda::Function
    Condition: CreateReplicationRole
    Properties:
      Description: Applies the write-once archive replication configuration to the Control Tower log bucket.
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt ReplicationConfigFunctionRole.Arn
      Code:
        ZipFile: |
          # The response is posted with urllib rather than the cfnresponse helper. AWS only injects
          # cfnresponse for inline code in a directly deployed stack; through a StackSet the module
          # is absent and the function dies on import with
          # "Runtime.ImportModuleError: No module named 'cfnresponse'", never signals CloudFormation,
          # and the custom resource hangs until it times out and rolls the stack back.
          import json, urllib.request
          import boto3

          s3 = boto3.client('s3')

          def send(event, context, status, data=None, reason=None):
              body = json.dumps({
                  'Status': status,
                  'Reason': reason or f'See CloudWatch log stream {context.log_stream_name}',
                  'PhysicalResourceId': event.get('PhysicalResourceId') or context.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'NoEcho': False,
                  'Data': data or {},
              }).encode('utf-8')
              req = urllib.request.Request(
                  event['ResponseURL'], data=body, method='PUT',
                  headers={'content-type': '', 'content-length': str(len(body))},
              )
              urllib.request.urlopen(req)

          def handler(event, context):
              props = event['ResourceProperties']
              source = props['SourceBucket']
              try:
                  if event['RequestType'] in ('Create', 'Update'):
                      s3.put_bucket_replication(
                          Bucket=source,
                          ReplicationConfiguration={
                              'Role': props['RoleArn'],
                              'Rules': [{
                                  'ID': 'sr-lz-write-once-archive',
                                  'Priority': 1,
                                  'Status': 'Enabled',
                                  'Filter': {},
                                  'DeleteMarkerReplication': {'Status': 'Disabled'},
                                  'Destination': {'Bucket': props['DestinationBucketArn']},
                              }],
                          },
                      )
                  # Delete is intentionally a no-op.
                  send(event, context, 'SUCCESS')
              except Exception as exc:
                  print(exc)
                  send(event, context, 'FAILED', {'Error': str(exc)}, str(exc))
      Tags: [{ Key: Client, Value: SAP_Retail }, { Key: ManagedBy, Value: Kitstek }]
  ApplySourceBucketReplication:
    Type: Custom::SourceBucketReplication
    Condition: CreateReplicationRole
    DependsOn: [LogArchiveBucketPolicy]
    Properties:
      ServiceToken: !GetAtt ReplicationConfigFunction.Arn
      SourceBucket: !Ref SourceLoggingBucketName
      DestinationBucketArn: !GetAtt LogArchiveBucket.Arn
      RoleArn: !GetAtt ReplicationRole.Arn
Outputs:
  LogArchiveBucketArn: { Value: !GetAtt LogArchiveBucket.Arn }
  LogArchiveBucketName: { Value: !Ref LogArchiveBucket }
  DeliveryPrefix: { Value: !Sub '${LogArchiveBucket.Arn}/AWSLogs' }
  ReplicationRoleArn: { Condition: CreateReplicationRole, Value: !GetAtt ReplicationRole.Arn }
