AWSTemplateFormatVersion: '2010-09-09'
Description: SAP_Retail generic account baseline for centralized logging configuration.

Parameters:
  CentralLogBucketName:
    Type: String
    Default: <CENTRAL_LOG_BUCKET_NAME>
    Description: Private deployment value for an existing approved log bucket.
  BaselineName:
    Type: String
    Default: SAP_Retail
    Description: A descriptive baseline label.

Resources:
  AccountBaselineMarker:
    Type: AWS::CloudFormation::WaitConditionHandle
    Metadata:
      BaselineName:
        Ref: BaselineName
      CentralLogBucketName:
        Ref: CentralLogBucketName

Outputs:
  BaselineName:
    Description: Baseline label recorded by this framework template.
    Value:
      Ref: BaselineName
