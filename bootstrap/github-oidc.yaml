AWSTemplateFormatVersion: "2010-09-09"
Description: Pipeline bootstrap for the SAP_Retail landing zone repo (management account) - GitHub OIDC provider, PR validate role, deploy role, CloudFormation execution role, template bucket (Q8; Kit D8). Deploy once by hand; stack sr-lz-bootstrap.
# Roles:
#   sr-lz-github-validate   pull requests only: validate-policy, validate-template, read-only verify checks
#   sr-lz-github-deploy     main branch via GitHub environment "management" (required reviewers): change sets only
#   sr-lz-cfn-exec          assumed by CloudFormation to apply changes (the only role that writes)

Parameters:
  GitHubOwner:
    Type: String
    Default: <GITHUB_OWNER>
  GitHubRepo:
    Type: String
    Default: sap-retail-lz-iac
  CreateOIDCProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  ApnTagValue:
    Type: String
    Default: "<APN_ID>"

Conditions:
  CreateProvider: !Equals [!Ref CreateOIDCProvider, "true"]

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      Tags:
        - { Key: ManagedBy, Value: Kitstek }
        - { Key: aws-apn-id, Value: !Ref ApnTagValue }

  TemplateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "sr-lz-templates-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-template-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 365 }
      Tags:
        - { Key: ManagedBy, Value: Kitstek }
        - { Key: aws-apn-id, Value: !Ref ApnTagValue }

  # StackSets in member accounts read templates from here (service-managed StackSets fetch as the management account).
  TemplateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TemplateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt TemplateBucket.Arn, !Sub "${TemplateBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sr-lz-cfn-exec
      Description: Assumed by CloudFormation to apply landing zone changes from the pipeline.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      Tags:
        - { Key: ManagedBy, Value: Kitstek }
        - { Key: aws-apn-id, Value: !Ref ApnTagValue }

  GitHubValidateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sr-lz-github-validate
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOwner}/${GitHubRepo}:pull_request"
                  - !Sub "repo:${GitHubOwner}/${GitHubRepo}:environment:verify"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      Policies:
        - PolicyName: validate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - access-analyzer:ValidatePolicy
                  - access-analyzer:CheckNoNewAccess
                  - cloudformation:ValidateTemplate
                  - cloudformation:DetectStackDrift
                  - cloudformation:DetectStackResourceDrift
                Resource: "*"
              - Sid: VerifyInMemberAccounts
                Effect: Allow
                Action: sts:AssumeRole
                Resource: arn:aws:iam::*:role/KitstekSecurityAuditRole
      Tags:
        - { Key: ManagedBy, Value: Kitstek }
        - { Key: aws-apn-id, Value: !Ref ApnTagValue }

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sr-lz-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOwner}/${GitHubRepo}:environment:management"
                  - !Sub "repo:${GitHubOwner}/${GitHubRepo}:environment:management-plan"
      Policies:
        - PolicyName: cfn-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ChangeSets
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                  - cloudformation:ListStackSetOperations
                  - cloudformation:DescribeStackSetOperation
                Resource: "*"
              - Sid: PassExecRoleToCloudFormationOnly
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals: { iam:PassedToService: cloudformation.amazonaws.com }
              - Sid: Templates
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "${TemplateBucket.Arn}/*"
      Tags:
        - { Key: ManagedBy, Value: Kitstek }
        - { Key: aws-apn-id, Value: !Ref ApnTagValue }

Outputs:
  ValidateRoleArn: { Value: !GetAtt GitHubValidateRole.Arn }
  DeployRoleArn: { Value: !GetAtt GitHubDeployRole.Arn }
  ExecutionRoleArn: { Value: !GetAtt CloudFormationExecutionRole.Arn }
  TemplateBucketName: { Value: !Ref TemplateBucket }
