name: Validate public framework

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate offline framework files
        shell: pwsh
        run: ./scripts/validate.ps1
